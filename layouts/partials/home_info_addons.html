<div class="latest-posts">
    <h3>Latest Posts</h3>
    <ul class="post-list">
        {{- $pages := where .Site.RegularPages "Type" "posts" }}
        {{- range first 3 $pages }}
        <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
            <span class="post-meta">{{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read</span>
        </li>
        {{- end }}
    </ul>
    <a href="/posts/" class="see-all">See all posts →</a>
</div>
